name: Auto-Retrain Phishing Model

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to manually trigger it from GitHub

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Update Pipeline
        run: |
          python scripts/auto_update_pipeline.py

      - name: Commit and Push New Model
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add models/production_xgboost_model.pkl models/model_features.pkl
          git commit -m "Auto-Retrain: Updated model with latest live PhishTank data" || echo "No changes to commit"
          git push